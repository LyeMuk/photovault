version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint only supports typescript <6.1.0 (see docs/DECISIONS.md) —
      # a 7.x bump breaks `npm run lint`. Revisit once typescript-eslint catches up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: swift
    directory: /native/PhotoVaultKit
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
