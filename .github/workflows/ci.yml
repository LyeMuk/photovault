name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    name: web (lint, types, tests, e2e)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  native:
    name: native (swift test + ios build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # CI runs on macos-latest, which ships full Xcode — the -plugin-path workaround
      # in Package.swift (needed only under bare Command Line Tools, see
      # docs/DECISIONS.md 0002) is a no-op here.
      - name: swift test
        working-directory: native/PhotoVaultKit
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: build web assets
        working-directory: apps/web
        run: npm run build
      - name: sync web assets into the iOS project
        working-directory: apps/mobile
        run: npx cap copy ios
      - name: build the iOS app for the simulator
        working-directory: apps/mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' build
      # XCUITest against a booted simulator is Phase 1+ work, once there's a real
      # device flow (Photos/drive) worth exercising end to end.

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    name: license check (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          npx license-checker --production \
            --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Python-2.0" \
            --excludePackages "@photovault/web@0.0.0"

  network-deny-test:
    name: network deny-list (web layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - name: fail if a network-call API appears in the web source
        run: |
          # docs/CONTEXT.md §13: "No outbound network calls except (a) the update
          # check and (b) opt-in map tiles" — both of those live in native code,
          # never the WebView. Flags the actual call sites (fetch/XHR/WebSocket/
          # axios), not bare URL-shaped strings — an SVG xmlns like
          # "http://www.w3.org/2000/svg" is not a network call.
          if grep -rEn "\bfetch\(|XMLHttpRequest|new WebSocket\(|\baxios\b" src --include="*.ts" --include="*.tsx"; then
            echo "Found a network-call API in apps/web/src — see docs/CONTEXT.md §13's privacy promise."
            exit 1
          fi
